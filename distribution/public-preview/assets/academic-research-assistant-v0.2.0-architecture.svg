<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Academic Research Assistant AI Agents version 0.2.0 architecture</title>
  <desc id="desc">Seven evidence-bound research support capabilities coordinated around user materials and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f7"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #496276; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .node-copy { font: 400 14px Arial, sans-serif; fill: #496276; }
      .center-title { font: 700 22px Arial, sans-serif; fill: white; }
      .center-copy { font: 400 14px Arial, sans-serif; fill: #dceff0; }
      .line { stroke: #77aeb0; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" class="title">Academic Research Assistant AI Agents</text>
  <text x="60" y="98" class="subtitle">Public Preview 0.2.0 · evidence-bound, auditable, source-aware</text>

  <path class="line" d="M600 350 L275 190 M600 350 L600 190 M600 350 L925 190 M600 350 L260 510 M600 350 L495 555 M600 350 L705 555 M600 350 L940 510"/>

  <g filter="url(#shadow)">
    <rect x="470" y="280" width="260" height="140" rx="24" fill="#17324d"/>
    <text x="600" y="332" text-anchor="middle" class="center-title">Capability coordination</text>
    <text x="600" y="360" text-anchor="middle" class="center-copy">User request + registered sources</text>
    <text x="600" y="385" text-anchor="middle" class="center-copy">No fixed linear pipeline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="130" y="130" width="290" height="115" rx="18" fill="white"/>
    <text x="155" y="171" class="node-title">Evidence</text>
    <text x="155" y="199" class="node-copy">Citation keys, pages, extracts, confidence</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="455" y="130" width="290" height="115" rx="18" fill="white"/>
    <text x="480" y="171" class="node-title">Data assets</text>
    <text x="480" y="199" class="node-copy">Inputs, operations, outputs, hashes</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="130" width="290" height="115" rx="18" fill="white"/>
    <text x="805" y="171" class="node-title">Stata technical results</text>
    <text x="805" y="199" class="node-copy">Settings, values, tables, diagnostics</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="470" width="290" height="115" rx="18" fill="white"/>
    <text x="140" y="511" class="node-title">User-source LaTeX layout</text>
    <text x="140" y="539" class="node-copy">Registered text, mechanical formatting</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="555" width="290" height="115" rx="18" fill="white"/>
    <text x="375" y="596" class="node-title">Source-bound Beamer</text>
    <text x="375" y="624" class="node-copy">Slide provenance and frame labels</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="660" y="555" width="290" height="115" rx="18" fill="white"/>
    <text x="685" y="596" class="node-title">Integration status</text>
    <text x="685" y="624" class="node-copy">Capabilities, blockers, next actions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="795" y="470" width="290" height="115" rx="18" fill="white"/>
    <text x="820" y="511" class="node-title">Validation checks</text>
    <text x="820" y="539" class="node-copy">Contracts, sources, compile, boundaries</text>
  </g>
</svg>
